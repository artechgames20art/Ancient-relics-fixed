name: Build AncientRelics
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Plugin
        run: mvn -B clean package -f pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: AncientRelics
          path: target/*.jar
